# OpenHomepower broker — a secure, self-hostable MQTT broker for Energizer
# Homepower batteries, so your battery need not depend on the vendor cloud.
#
# Security:
#   * per-device credentials — each device has its own login
#   * per-device isolation via the ACL — each device confined to its own topics
#   * plaintext on a trusted network; TLS available for clients that support it

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type warning
log_type notice

# Nobody connects without valid credentials.
allow_anonymous false
password_file /mosquitto/config/passwordfile
acl_file /mosquitto/config/aclfile

# Plaintext MQTT for the Homepower gateway daemon. Its firmware links no crypto
# library, so the DEVICE cannot speak TLS. KEEP THIS LISTENER ON A TRUSTED
# NETWORK — your LAN, or reach a remote broker over a VPN/tunnel. Never expose
# 1883 directly to the internet.
listener 1883

# TLS listener for clients that CAN do TLS (Home Assistant, the app, dashboards).
# Generate certs (see README) and uncomment:
# listener 8883
# cafile   /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile  /mosquitto/config/certs/server.key
