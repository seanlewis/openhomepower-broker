name: OpenHomepower Secure Broker
version: "0.2.2"
slug: openhomepower_broker
description: >-
  A secure MQTT broker for Energizer Homepower batteries — per-device
  credentials and per-device isolation, replacing Enertek's abandoned cloud.
url: https://github.com/seanlewis/openhomepower-broker
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
startup: application
boot: auto
init: false
# Port 1885: clear of the default Mosquitto add-on, which occupies 1883 (MQTT),
# 1884 (WebSockets) and 8883/8884 (TLS). This runs alongside it without touching
# the broker Zigbee2MQTT uses.
ports:
  1885/tcp: 1885
ports_description:
  1885/tcp: Plaintext MQTT for the battery — keep on a trusted network
options:
  devices: []
  battery_login:
    username: ""
    password: ""
schema:
  devices:
    - serial: match(^[0-9]+$)
      password: password
  battery_login:
    username: str?
    password: password?
