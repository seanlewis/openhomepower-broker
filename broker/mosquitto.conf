persistence true
persistence_location /data/
log_dest stdout
log_type warning
log_type notice

allow_anonymous false
password_file /data/passwordfile
acl_file /etc/openhomepower/aclfile

# Plaintext MQTT for the battery daemon (which cannot do TLS). Keep this on a
# trusted LAN. Port 1885 avoids the default Mosquitto add-on (1883/1884/8883/8884).
listener 1885
